        <h1>Fried Eggs</h1>
        <img src="../images/fried-eggs.avif">
        <h3>Ingredients</h3>
        <ul>
            <li>Eggs</li>
            <li>Butter</li>
            <li>Salt</li>
        </ul>
        <h3>Steps</h3>
        <ol>
            <li>Melt butter in frying pan over medium heat</li>
            <li>Crack eggs into pan</li>
            <li>Cook for 2-4 minutes, until the whites are set</li>
            <li>Sprinkle with salt and serve</li>
        </ol>
